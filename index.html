 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MontCode™ Rescue Receiver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-black text-white flex flex-col items-center justify-center min-h-screen p-6 font-sans overflow-hidden">

    <div id="status-card" class="w-full max-w-md bg-zinc-900 border border-zinc-800 p-10 rounded-[3rem] text-center shadow-2xl transition-all duration-500">
        <div class="w-24 h-24 mx-auto mb-8 bg-zinc-800 rounded-full flex items-center justify-center border-4 border-zinc-700 shadow-inner overflow-hidden">
            <img src="logo.png.jpg" alt="Logo" class="w-full h-full object-cover">
        </div>
        <h2 class="text-3xl font-black italic uppercase tracking-tighter text-[#ccff00] mb-2">Monitor Mode</h2>
        <p id="status-sub" class="text-zinc-500 text-[10px] uppercase tracking-[0.4em] mb-10 font-bold">System Standby</p>
        
        <button onclick="armSystem()" id="btn-arm" class="w-full bg-[#ccff00] text-black py-5 rounded-3xl font-black text-xs uppercase tracking-widest active:scale-95 transition-all shadow-xl shadow-[#ccff00]/10 border-b-4 border-black/20">
            Arm Tactical System
        </button>
    </div>

    <div id="alert-panel" class="fixed inset-0 bg-red-600 z-[100] flex flex-col items-center justify-center p-8 hidden">
        <div class="absolute inset-0 bg-red-700 animate-pulse opacity-50"></div>
        <div class="relative z-10 flex flex-col items-center text-center">
            <h1 class="text-8xl font-black italic mb-6 animate-bounce tracking-tighter">SOS</h1>
            <div class="bg-black/20 p-8 rounded-[2rem] backdrop-blur-md border border-white/10 w-full max-w-sm">
                <p class="text-zinc-200 text-[10px] uppercase tracking-widest mb-2 font-black">Rescue Signal Detected</p>
                <p class="text-4xl font-black uppercase tracking-tighter" id="alert-name">---</p>
                <hr class="my-4 border-white/20">
                <p class="text-sm font-mono font-bold opacity-90" id="alert-coords">Awaiting GPS...</p>
            </div>
            
            <button onclick="stopAlarm()" class="mt-12 bg-white text-red-600 px-16 py-5 rounded-full font-black uppercase tracking-widest shadow-2xl active:scale-90 transition-all border-b-4 border-zinc-300">
                Silence Alarm
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging.js";

        // --- CONFIGURACIÓN ---
        const firebaseConfig = {
            apiKey: "AIzaSyDVIQ4S-w4Ag40uYuArW3o7Hw2XQwoQV7U",
            authDomain: "montcode-e02c7.firebaseapp.com",
            databaseURL: "https://montcode-e02c7-default-rtdb.firebaseio.com",
            projectId: "montcode-e02c7",
            storageBucket: "montcode-e02c7.firebasestorage.app",
            messagingSenderId: "988300151844",
            appId: "1:988300151844:web:b1a31275a9555de98a9cb1"
        };

        // LLAVE DEL SENDER (ID ÚNICO) - Cambia esto por el ID real del paciente
        const PATIENT_ID = "MONTC-12345"; 

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messaging = getMessaging(app);

        // --- MOTOR DE SONIDO ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let alarmOscillator = null;

        function playSirene() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.loop = true;
            osc.start();
            return osc;
        }

        // --- REGISTRO SERVICE WORKER ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/firebase-messaging-sw.js')
            .then((reg) => {
                Notification.requestPermission().then((perm) => {
                    if (perm === 'granted') {
                        getToken(messaging, { vapidKey: 'BLvXmJRba9sPidOT9vrNIi3XvLXI9QdfDd6WAKiYTK4hZM9t9gqUoovVRYxFIsiHD4mkuVr2sRfrJU8eWLYeXq0' })
                        .then((token) => console.log("Device Token:", token));
                    }
                });
            });
        }

        // --- ACTIVAR ESCUCHA ---
        window.armSystem = async () => {
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            
            document.getElementById('btn-arm').innerText = "ACTIVE & GUARDING 🛡️";
            document.getElementById('btn-arm').className = "w-full bg-zinc-800 text-zinc-500 py-5 rounded-3xl font-black text-xs uppercase tracking-widest cursor-default border-b-4 border-black/40";
            document.getElementById('status-sub').innerText = `Monitoring: ${PATIENT_ID}`;
            document.getElementById('status-sub').classList.add('text-[#ccff00]', 'animate-pulse');

            // ESCUCHA FILTRADA: Solo alertas que coincidan con el PatientID
            const alertsRef = ref(db, 'alerts/');
            onValue(alertsRef, (snap) => {
                const data = snap.val();
                if (data) {
                    // Buscamos la última alerta del paciente específico
                    const latest = Object.values(data)
                        .filter(a => a.patientId === PATIENT_ID)
                        .sort((a,b) => b.timestamp - a.timestamp)[0];

                    // Si la alerta es reciente (últimos 30 seg), disparar sirena
                    if (latest && (Date.now() - latest.timestamp < 30000)) {
                        triggerAlarm(latest);
                    }
                }
            });
        };

        function triggerAlarm(data) {
            document.getElementById('alert-panel').classList.remove('hidden');
            document.getElementById('alert-name').innerText = data.patientName || "Unknown Patient";
            document.getElementById('alert-coords').innerText = data.location || "GPS Denied";
            
            if (!alarmOscillator) alarmOscillator = playSirene();
            if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 500]);
        }

        window.stopAlarm = () => {
            if (alarmOscillator) {
                alarmOscillator.stop();
                alarmOscillator = null;
            }
            document.getElementById('alert-panel').classList.add('hidden');
        };
    </script>
</body>
</html>

 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MontCode™ Rescue Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-black text-white font-sans min-h-screen flex flex-col items-center p-6 overflow-x-hidden">

    <header class="text-center mb-8 mt-4">
        <div class="w-16 h-16 bg-zinc-900 rounded-full mx-auto mb-4 border-2 border-[#ccff00]/20 overflow-hidden">
            <img src="logo.png.jpg" alt="Logo" class="w-full h-full object-cover">
        </div>
        <h1 class="text-[#ccff00] text-2xl font-black italic tracking-tighter uppercase leading-none">Rescue Monitor</h1>
        <p class="text-zinc-500 text-[10px] tracking-[0.3em] uppercase mt-1">Tactical Receiver v6.1</p>
    </header>

    <div id="link-screen" class="w-full max-w-sm bg-zinc-900/50 border border-zinc-800 p-8 rounded-[2rem] text-center mb-6 shadow-xl hidden">
        <h2 class="text-[#ccff00] font-black text-xs uppercase tracking-[0.2em] mb-4">Link Patient Device</h2>
        <input type="text" id="target-id" placeholder="ENTER RESCUE ID (MC-XXXX)" 
               class="w-full bg-black border border-zinc-800 p-4 rounded-2xl mb-4 text-center text-[#ccff00] font-mono text-xl outline-none focus:border-[#ccff00] transition-all uppercase">
        <button onclick="saveTargetID()" class="w-full bg-white text-black py-4 rounded-2xl font-black text-xs uppercase tracking-widest active:scale-95 transition-all">
            Link and Monitor
        </button>
    </div>

    <div id="status-card" class="w-full max-w-sm bg-zinc-900/50 border border-zinc-800 p-8 rounded-[2rem] text-center mb-6 shadow-xl transition-all duration-500">
        <div id="status-icon" class="w-20 h-20 bg-zinc-800 rounded-full mx-auto mb-6 flex items-center justify-center border-2 border-zinc-700 transition-all shadow-inner">
            <span id="emoji-state" class="text-3xl">📡</span>
        </div>
        <p id="monitoring-label" class="text-[#ccff00] text-[10px] font-mono mb-2 hidden"></p>
        <h2 id="monitor-state" class="text-zinc-400 font-bold uppercase text-[10px] tracking-[0.2em] mb-6">System Disarmed</h2>
        
        <button onclick="armSystem()" class="w-full bg-[#ccff00] text-black py-4 rounded-2xl font-black text-xs uppercase tracking-widest active:scale-95 transition-all shadow-lg shadow-[#ccff00]/10">
            Arm Tactical System
        </button>
        <button onclick="clearTargetID()" class="mt-4 text-zinc-600 text-[8px] uppercase font-bold tracking-widest hover:text-white">Change Patient ID</button>
    </div>

    <div id="alert-panel" class="hidden w-full max-w-sm bg-red-600 p-8 rounded-[2rem] animate-pulse shadow-[0_0_60px_rgba(220,38,38,0.6)] border-4 border-white/20">
        <div class="flex items-center gap-3 mb-4">
            <span class="text-3xl">🚨</span>
            <h2 class="text-white font-black text-2xl italic uppercase tracking-tighter">Emergency</h2>
        </div>
        <p id="patient-info" class="text-white font-bold text-lg mb-2"></p>
        <p id="alert-time" class="text-white/60 font-mono text-[10px] mb-6"></p>
        
        <button id="location-btn" class="w-full bg-white text-red-600 py-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg active:scale-95 transition-all">
            Open GPS Location
        </button>
        
        <button onclick="stopAlarm()" class="w-full mt-4 bg-black/20 text-white/80 py-2 rounded-xl font-bold text-[10px] uppercase">
            Mute Local Alarm
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-messaging.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDVIQ4S-w4Ag40uYuArW3o7Hw2XQwoQV7U",
            authDomain: "montcode-e02c7.firebaseapp.com",
            databaseURL: "https://montcode-e02c7-default-rtdb.firebaseio.com",
            projectId: "montcode-e02c7",
            storageBucket: "montcode-e02c7.firebasestorage.app",
            messagingSenderId: "988300151844",
            appId: "1:988300151844:web:b1a31275a9555de98a9cb1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messaging = getMessaging(app);
        const audio = new Audio('https://actions.google.com/sounds/v1/alarms/emergency_it_is_an_emergency.ogg');
        audio.loop = true;

        // --- GESTIÓN DE ENLACE ---
        let currentTargetID = localStorage.getItem('linked_rescue_id');

        window.onload = () => {
            if (!currentTargetID) {
                document.getElementById('link-screen').classList.remove('hidden');
                document.getElementById('status-card').classList.add('hidden');
            } else {
                showMonitoringLabel();
            }
        };

        window.saveTargetID = () => {
            const id = document.getElementById('target-id').value.trim().toUpperCase();
            if (id.startsWith('MC-')) {
                localStorage.setItem('linked_rescue_id', id);
                location.reload();
            } else {
                alert("Invalid ID. Must start with MC-");
            }
        };

        window.clearTargetID = () => {
            localStorage.removeItem('linked_rescue_id');
            location.reload();
        };

        function showMonitoringLabel() {
            const label = document.getElementById('monitoring-label');
            label.innerText = `LINKED: ${currentTargetID}`;
            label.classList.remove('hidden');
        }

        // --- SISTEMA DE ARMADO ---
        window.armSystem = async () => {
            audio.play().then(() => {
                audio.pause();
                audio.currentTime = 0;
                updateUIState(true);
                startListening(); // Iniciar escucha solo cuando se arma
            }).catch(e => console.error("Audio block:", e));
            
            try {
                const permission = await Notification.requestPermission();
                if (permission === 'granted') {
                    // Aquí iría tu VAPID Key para producción
                    const token = await getToken(messaging, { vapidKey: 'TU_VAPID_KEY_AQUI' });
                }
            } catch (err) { console.log("Push Error:", err); }
        };

        function updateUIState(isArmed) {
            document.getElementById('monitor-state').innerText = isArmed ? "Monitoring Active" : "System Disarmed";
            const icon = document.getElementById('status-icon');
            if(isArmed) {
                icon.classList.replace('bg-zinc-800', 'bg-[#ccff00]/10');
                icon.classList.add('border-[#ccff00]');
                document.getElementById('emoji-state').innerText = "🛡️";
            }
        }

        // --- ESCUCHA ESPECÍFICA POR ID ---
        function startListening() {
            if (!currentTargetID) return;
            
            // ESCUCHAMOS SOLO EL ID ENLAZADO
            const alertRef = ref(db, `alerts/${currentTargetID}`);
            onValue(alertRef, (snapshot) => {
                const data = snapshot.val();
                if (data && data.status === 'CRITICAL') {
                    const now = Date.now();
                    if ((now - data.timestamp) < 120000) { // Margen de 2 min
                        triggerVisualAlert(data);
                    }
                }
            });
        }

        function triggerVisualAlert(alertData) {
            document.getElementById('status-card').classList.add('hidden');
            const panel = document.getElementById('alert-panel');
            panel.classList.remove('hidden');
            document.getElementById('patient-info').innerText = alertData.patientName;
            document.getElementById('alert-time').innerText = new Date(alertData.timestamp).toLocaleTimeString();
            
            if (navigator.vibrate) navigator.vibrate([500, 200, 500]);
            audio.play().catch(() => {});

            document.getElementById('location-btn').onclick = () => {
                window.open(`https://www.google.com/maps?q=${alertData.location}`, '_blank');
            };
        }

        window.stopAlarm = () => {
            audio.pause();
            audio.currentTime = 0;
            document.getElementById('alert-panel').classList.add('hidden');
            document.getElementById('status-card').classList.remove('hidden');
        };

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
